# ── macura_backflip.yaml ──────────────────────────────────────────────────────
# Single source of truth for all quantities. Nothing is hard-coded in the .py
# files; every module receives the relevant sub-config. The task is Pogo (a
# planar one-legged gymnast) learning a BACKFLIP — an aggressive, unstable
# maneuver where a fixed-horizon rollout over-imagines the flight/landing, so
# MACURA's uncertainty-adaptive truncation has a real job.

experiment:
  name: macura_pogo_backflip
  seeds: [0, 1, 2]            # first pass: 3 seeds (raise to 5 for final figures)
  algorithms: [macura, mbpo, m2ac, sac]
  total_env_steps: 40000     # a backflip is harder than a hover; scale up if needed
  warmup_random_steps: 1000  # seed the buffers with random interaction first
  eval_every_steps: 2000
  eval_episodes: 5
  eval_seeds: [100, 101, 102, 103, 104]   # SAME across all algorithms (fairness)
  drive_root: /content/drive/MyDrive/macura-backflip

# ── environment (Pogo backflip) ───────────────────────────────────────────────
env:
  mjcf_scene: ""              # "" -> use the bundled envs/assets/pogo.xml
  action_repeat: 5            # hold each action for 5 physics steps (0.01 s control)
  max_episode_steps: 200      # ~2 s episodes (200 * 5 * 0.002 s)
  fail_torso_height: 0.10     # torso center below this = collapsed/face-plant flat (a legit
                              # flight only dips to ~0.15; a flat body is ~0.075)
  init_height: 0.78           # near-standing torso height at reset (legs extended)
  init_noise: 0.04            # small random perturbation of pose + velocity at reset
  # --- dense shaped backflip reward (identical for real + imagined transitions) ---
  # w_rotation is the CURRICULUM knob: 0 = just jump & balance, large = full flip.
  reward:
    alive_bonus: 1.0          # keeps reward positive
    w_height: 4.0             # reward foot clearance (get airborne so it CAN flip)
    w_rotation: 1.0           # reward spinning in flip_dir WHILE airborne (dense flip signal)
    w_upright: 2.0            # reward being upright when NOT airborne (land and hold)
    w_action: 0.001           # control-effort penalty
    flip_dir: 1.0             # +1 = one rotation direction (sign is arbitrary, kept consistent)
    foot_air: 0.20            # foot clearance (m) at which "airborne" gate saturates
    height_cap: 0.5           # cap on the foot-clearance jump reward

# ── probabilistic ensemble (shared by all model-based algos) ──────────────────
ensemble:
  num_members: 5              # paper uses an ensemble; 5 is standard
  hidden_size: 200
  num_layers: 4
  activation: silu
  learning_rate: 1.0e-3
  weight_decay: 1.0e-5
  batch_size: 256
  train_epochs_per_round: 20
  logvar_bounds: [-10.0, 0.5] # bound logvars -> stable uGJS (Eq. 15-19)
  deterministic: false
  propagation: random_member

# ── SAC backbone (IDENTICAL for all four algorithms — fairness) ───────────────
sac:
  gamma: 0.99
  tau: 0.005
  alpha: auto
  actor_lr: 3.0e-4
  critic_lr: 3.0e-4           # NOTE: ignored — SB3 SAC uses ONE learning_rate (= actor_lr)
  hidden_size: 256
  batch_size: 256
  target_update_interval: 1
  gradient_steps_max: 20      # Gmax in Eq. 22 (model-based UTD ceiling)
  baseline_gradient_steps: 1  # model-free SAC baseline UTD (~1 = standard SAC; UTD-20 destabilizes)
  real_ratio: 0.05            # fixed batch-level real mixing (Janner/MBPO; MACURA inherits)

# ── checkpoint selection & final eval (best = highest periodic greedy-eval return) ─
selection:
  start_step: 8000            # don't select a "best" during the noisy early phase
  eval_every: 2000
  final_eval_episodes: 10

# ── rollout strategies (the ONLY thing that differs across algorithms) ────────
rollout:
  freq_steps: 250             # generate fresh model rollouts every N env steps
  num_rollouts: 400           # M parallel branched rollouts per round
  model_buffer_capacity: 200000

  # MACURA: uncertainty-adaptive truncation (Algorithm 2)
  macura:
    t_max: 10                 # paper default
    zeta: 0.95                # ζ-quantile of first-step uncertainties, paper default
    xi: 5.0                   # THE tunable knob; sweep this on the backflip
    adaptive_gradient_steps: true   # Eq. 22 UTD scaling

  # MBPO: fixed truncated-linear schedule (max_len matches MACURA t_max for fairness)
  mbpo:
    rollout_schedule: [1, 10, 1000, 24000]   # ramp 1->10 by 24k so MBPO uses its schedule
    adaptive_gradient_steps: false
    fixed_gradient_steps: 20

  # M2AC: fixed length + mask least-trustworthy transitions
  m2ac:
    t_max: 10
    mask_fraction: 0.5
    uncertainty_penalty: 1.0
    fixed_gradient_steps: 20

  # SAC: no model rollouts (model-free reference); ignored
  sac: {}

# ── exploration (kept CONSISTENT across algos to avoid the exploration confound) ─
exploration:
  type: pink_noise            # 'deterministic' | 'white_noise' | 'pink_noise'
  scale: 0.3                  # a flip needs vigorous exploration to be discovered

# ── curriculum (optional): train jump -> half-flip -> full flip, warm-starting ─
# The notebook can run these stages in order, each loading the previous best.
# Each stage only overrides reward.w_rotation (and, for stage 1, the eval target).
curriculum:
  stage1_boing:    { reward: { w_rotation: 0.0 } }   # learn to jump and land upright
  stage2_halfflip: { reward: { w_rotation: 0.5 } }   # learn a half rotation
  stage3_flip:     { reward: { w_rotation: 1.0 } }   # full backflip (same as base)

# ── speed profile ─────────────────────────────────────────────────────────────
profiles:
  fast:
    experiment:
      total_env_steps: 20000
      warmup_random_steps: 1000
      eval_every_steps: 2000
    sac:
      gradient_steps_max: 8
    selection:
      start_step: 4000
      eval_every: 2000
      final_eval_episodes: 10
    ensemble:
      train_epochs_per_round: 8
    rollout:
      num_rollouts: 200
      freq_steps: 500
      mbpo:
        rollout_schedule: [1, 10, 1000, 12000]
        fixed_gradient_steps: 8   # UTD parity: match gradient_steps_max (8 in fast)
      m2ac:
        fixed_gradient_steps: 8
