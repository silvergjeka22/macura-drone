# ── macura_drone.yaml ─────────────────────────────────────────────────────────
# Single source of truth for all quantities. Nothing is hard-coded in the .py
# files; every module receives the relevant sub-config. Paper-faithful defaults
# are noted inline. Tuned for FAST, low-step results on the hover task.

experiment:
  name: macura_drone_hover
  seeds: [0, 1, 2]            # first pass: 3 seeds (raise to 5 for final figures)
  algorithms: [macura, mbpo, m2ac, sac]
  total_env_steps: 30000     # low-step first pass; ordering of curves emerges here
  warmup_random_steps: 1000  # seed the buffers with random interaction first
  eval_every_steps: 1000
  eval_episodes: 5
  eval_seeds: [100, 101, 102, 103, 104]   # SAME across all algorithms (fairness)
  drive_root: /content/drive/MyDrive/macura-drone

# ── environment ───────────────────────────────────────────────────────────────
env:
  backend: pybullet           # 'pybullet' (gym-pybullet-drones) | 'mujoco' (Skydio X2)
  task: hover                 # 'hover' | 'track' (track = moving reference)
  mjcf_scene: /content/mujoco_menagerie/skydio_x2/scene.xml
  target_position: [0.0, 0.0, 1.0]   # hover / takeoff target at 1 m
  action_repeat: 3            # frame-skip: fewer agent steps to cover the task
  max_episode_steps: 250      # short fixed horizon (after action_repeat)
  # --- PyBullet (gym-pybullet-drones) backend ---
  pybullet:
    drone_model: cf2x         # Crazyflie 2.x (X config)
    pyb_freq: 240             # physics step frequency (Hz)
    ctrl_freq: 60             # control frequency (Hz)
    action_scale: 0.1         # action a in [-1,1] -> rpm = HOVER_RPM*(1 + scale*a)
    render:                   # camera follows the drone, zoomed in for visibility
      width: 896              # multiples of 16 -> no ffmpeg resize warning
      height: 704
      distance: 0.7           # metres from the drone (small = big drone in frame)
      yaw: 50
      pitch: -25
      fov: 60
  # --- robustness / noise study (Part 3); enabled=false by default ---
  noise:
    enabled: false
    obs_noise_std: 0.0        # Gaussian sensor noise added to observations
    action_noise_std: 0.0     # Gaussian noise added to actions (delay/jitter proxy)
  # --- near-hover initialization (key low-step lever) ---
  init_pos_noise: 0.10        # m, uniform box around target
  init_ang_noise: 0.10        # rad, small attitude perturbation
  init_lin_vel_noise: 0.10    # m/s
  init_ang_vel_noise: 0.10    # rad/s
  # --- termination (failure) ---
  tilt_limit: 1.0             # rad (~57 deg): beyond this counts as a tumble
  position_bound: 1.5         # m from target before "out of envelope"
  floor_z: 0.05               # m: below this = crashed into ground
  # --- dense quadratic reward weights ---
  reward:
    w_position: 1.0           # ||pos - target||^2
    w_velocity: 0.05          # ||linvel||^2
    w_tilt: 0.5               # tilt^2 (uprightness)
    w_ang_vel: 0.02           # ||angvel||^2
    w_action: 0.01            # ||action||^2 (control effort)
    alive_bonus: 1.0          # per step, keeps reward dense & positive near hover
  # --- path-following (only used when task == 'track') ---
  track:
    radius: 0.5
    period_steps: 200

# ── probabilistic ensemble (shared by all model-based algos) ──────────────────
ensemble:
  num_members: 5              # paper uses an ensemble; 5 is standard
  hidden_size: 200
  num_layers: 4
  activation: silu
  learning_rate: 1.0e-3
  weight_decay: 1.0e-5
  batch_size: 256
  train_epochs_per_round: 20
  logvar_bounds: [-10.0, 0.5] # IMPORTANT: bound logvars -> stable uGJS (Eq. 15-19)
  deterministic: false        # probabilistic outputs (mean + variance)
  propagation: random_member  # how to sample a member during rollouts

# ── SAC backbone (IDENTICAL for all four algorithms — fairness) ───────────────
sac:
  gamma: 0.99
  tau: 0.005
  alpha: auto                 # automatic temperature tuning
  actor_lr: 3.0e-4
  critic_lr: 3.0e-4           # NOTE: ignored — SB3 SAC uses ONE learning_rate (= actor_lr); kept for reference
  hidden_size: 256
  batch_size: 256
  target_update_interval: 1
  gradient_steps_max: 20      # Gmax in Eq. 22 (model-based UTD ceiling)
  baseline_gradient_steps: 1  # model-free SAC baseline UTD (~1 = standard SAC; UTD-20 plain SAC
                              # destabilizes -> would be a strawman baseline. tasks.md Phase 4)
  real_ratio: 0.05            # paper-faithful FIXED batch-level real mixing (Janner/MBPO; MACURA
                              # inherits). IDENTICAL for MACURA/MBPO/M2AC. Each model-based SAC update
                              # draws a whole batch from the REAL buffer with prob real_ratio, else
                              # the MODEL buffer. SAC baseline is model-free (always 100% real).

# ── checkpoint selection & final eval (best = highest periodic greedy-eval return) ─
selection:
  start_step: 5000           # don't select a "best" during the noisy early phase
  eval_every: 1000           # periodic greedy-eval cadence (selection signal; falls back to
                             # experiment.eval_every_steps if omitted)
  final_eval_episodes: 10    # one larger greedy eval on the reloaded best checkpoint (run summary)

# ── rollout strategies (the ONLY thing that differs across algorithms) ────────
rollout:
  freq_steps: 250             # generate fresh model rollouts every N env steps
  num_rollouts: 400           # M parallel branched rollouts per round
  model_buffer_capacity: 100000

  # MACURA: uncertainty-adaptive truncation (Algorithm 2)
  macura:
    t_max: 10                 # paper default, not tuned
    zeta: 0.95                # ζ-quantile of first-step uncertainties, paper default
    xi: 5.0                   # THE one tunable knob; sweep this on the drone
    adaptive_gradient_steps: true   # Eq. 22 UTD scaling

  # MBPO: fixed truncated-linear schedule (must be tuned, else strawman)
  mbpo:
    # [min_len, max_len, start_step, end_step] — tuned for the 20k run (tasks.md
    # Phase 4): ramp 1 -> 10 between end-of-warmup and 12k, so MBPO actually uses
    # its schedule within the budget. max_len matches MACURA/M2AC t_max=10 for a
    # fair fixed-horizon competitor. (The old [1,15,1,15000] barely left length 1.)
    rollout_schedule: [1, 10, 1000, 12000]
    adaptive_gradient_steps: false
    fixed_gradient_steps: 20

  # M2AC: fixed length + mask least-trustworthy transitions
  m2ac:
    t_max: 10
    mask_fraction: 0.5        # keep the most-trustworthy half of imagined steps
    uncertainty_penalty: 1.0  # reward penalty on kept transitions
    fixed_gradient_steps: 20

  # SAC: no model rollouts (model-free reference); these are ignored
  sac: {}

# ── exploration (kept CONSISTENT across algos to avoid the exploration confound)
exploration:
  type: pink_noise            # 'deterministic' | 'white_noise' | 'pink_noise'
  scale: 0.1
  # NOTE: paper uses pink noise for MACURA but deterministic for MBPO/M2AC.
  # We apply ONE scheme to all four for a clean comparison (see tasks.md).

# ── speed profile ─────────────────────────────────────────────────────────────
# 'fast' trims the most expensive knobs for quicker runs at modest fidelity cost.
# The notebook deep-merges this over the base config when the fast profile is on.
# Values live HERE (single source of truth), not in the notebook.
profiles:
  fast:
    experiment:
      total_env_steps: 20000    # ~20k steps: enough for clear curves, quick on GPU
      warmup_random_steps: 1000
      eval_every_steps: 2000    # evaluate periodically (best-checkpoint tracking only)
    sac:
      gradient_steps_max: 8     # fewer SAC updates per step (was 20)
    selection:
      start_step: 4000          # earlier selection for the shorter 20k run
      eval_every: 2000          # matches the fast eval cadence
      final_eval_episodes: 10
    ensemble:
      train_epochs_per_round: 8 # fewer ensemble epochs per round (was 20)
    rollout:
      num_rollouts: 200         # fewer parallel branched rollouts (was 400)
      freq_steps: 500           # regenerate model data less often (was 250)
      # UTD parity: fixed UTD must equal gradient_steps_max (8 in fast), else
      # MBPO/M2AC would get MORE updates than MACURA's Eq. 22 ceiling allows.
      # NOTE: requires a DEEP merge of this profile (the notebook does one).
      mbpo:
        fixed_gradient_steps: 8
      m2ac:
        fixed_gradient_steps: 8
